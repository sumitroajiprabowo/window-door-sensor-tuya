services:
  door-sensor-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: door-sensor-monitor
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Application
      - ENV=${ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - FLASK_PORT=${FLASK_PORT:-5000}
      - FLASK_HOST=${FLASK_HOST:-0.0.0.0}
      - PYTHONUNBUFFERED=1

      # Tuya Configuration
      - TUYA_ACCESS_ID=${TUYA_ACCESS_ID}
      - TUYA_ACCESS_SECRET=${TUYA_ACCESS_SECRET}
      - TUYA_ENDPOINT=${TUYA_ENDPOINT:-https://openapi-sg.iotbing.com}
      - DEVICE_ID=${DEVICE_ID}
      - TUYA_PULSAR_ENDPOINT=${TUYA_PULSAR_ENDPOINT:-wss://mqe-sg.iotbing.com:8285/}
      - TUYA_TOPIC=${TUYA_TOPIC}

      # WhatsApp Configuration
      - WA_API_URL=${WA_API_URL}
      - WA_API_USER=${WA_API_USER}
      - WA_API_PASSWORD=${WA_API_PASSWORD}
      - WA_GROUP_ID=${WA_GROUP_ID}
      - WA_MESSAGE_DOOR_OPENED=${WA_MESSAGE_DOOR_OPENED:-DOOR OPENED - Server room accessed}
      - WA_MESSAGE_DOOR_CLOSED=${WA_MESSAGE_DOOR_CLOSED:-DOOR CLOSED - Server room secured}
      - WA_MESSAGE_SENSOR_INITIALIZED=${WA_MESSAGE_SENSOR_INITIALIZED:-SENSOR IS WORKING - Monitoring started}
      - WA_IS_FORWARDED=${WA_IS_FORWARDED:-false}
      - WA_DURATION=${WA_DURATION:-0}
    volumes:
      # Mount logs directory for persistent logs (optional)
      - ./logs:/app/logs:rw
    networks:
      - door-sensor-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  door-sensor-network:
    driver: bridge