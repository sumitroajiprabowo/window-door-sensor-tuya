apiVersion: apps/v1
kind: Deployment
metadata:
  name: door-sensor-monitor
  labels:
    app: door-sensor-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: door-sensor-monitor
  template:
    metadata:
      labels:
        app: door-sensor-monitor
    spec:
      containers:
      - name: door-sensor-monitor
        image: sumitroajiprabowo/door-sensor-monitor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
        env:
        - name: ENV
          value: "development"
        # Inject all secrets as environment variables
        envFrom:
          - secretRef:
              name: door-sensor-jebed-secrets
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        # Startup probe - allow up to 60s for app initialization
        startupProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12  # 10s + (5s * 12) = 70s max startup time
          timeoutSeconds: 3
        # Liveness probe - restart if app becomes unresponsive
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 0  # Startup probe handles initial delay
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 3
        # Readiness probe - remove from load balancer if unhealthy
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 0  # Startup probe handles initial delay
          periodSeconds: 10
          failureThreshold: 2
          timeoutSeconds: 3